name: event-registration-candidate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: events_dev
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - events-db:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: production
    environment:
      PORT: 3000
      DATABASE_URL: postgres://events:events@db:5432/events_dev
      DB_POOL_MAX: 10
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - node dist/src/scripts/migrate.js && node dist/src/scripts/seed.js && node dist/src/server.js
    ports:
      - "3000:3000"

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: events_test
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_test"]
      interval: 1s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: development
    profiles: ["test"]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://events:events@test-db:5432/events_test
      DB_POOL_MAX: 10
    depends_on:
      test-db:
        condition: service_healthy
    command: ["npm", "test"]

volumes:
  events-db:
